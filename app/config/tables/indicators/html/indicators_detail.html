<!DOCTYPE html>
<!-- TBL_IV_REF Detailed View -->
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="../../../assets/css/detail.css" type="text/css" rel="stylesheet" />
        <script type="text/javascript" src="../../../assets/commonDefinitions.js"></script>
        <script type="text/javascript" src="../../../assets/libs/jquery-3.4.1.js"></script>
        <script type="text/javascript" src="../../../../system/js/odkCommon.js"></script>
        <script type="text/javascript" src="../../../../system/js/odkData.js"></script>
        <script type="text/javascript" src="../../../../system/tables/js/odkTables.js"></script>
        <script type="text/javascript" src="../../../assets/js/util.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

        <style>
            #downloadPDFBtn {
                float: right;
                margin-left: 10px;
                background: #005fa3;
                color: white;
                border: none;
                border-radius: 5px;
                padding: 6px 12px;
                cursor: pointer;
            }
            #downloadPDFBtn i { margin-right: 5px; }
        </style>
    </head>

    <body>
        <script type="text/javascript" src="../js/indicators_detail.js"></script>

        <div class="card-header" id="report-content">
            <div class="title-block">
                <h3><span id="frig-hdr">Monthly Sentinel Surveillance</span></h3>
                <span id="tracking_id" class="tracking-id">Loading..</span>

                <div class="card-actions">
                    <button id="editSentSurveyBtn" onclick="onEditSentinelSurvey()" title="Edit" class="hideButton">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button id="delSentSurveyBtn" onclick="onDeleteSentinelSurvey()" title="Delete" class="hideButton">
                        <i class="bi bi-trash"></i> Delete
                    </button>
				</div>
            </div>

            <div class="header-icons">
                <i class="bi bi-hospital"></i>
                <i class="bi bi-bar-chart-line"></i>
                <i class="bi bi-box"></i>
                <i class="bi bi-hospital"></i>
                <i class="bi bi-snow"></i>
            </div>
        </div>

        <div class="section">
            <h4>Summary</h4>
            <div class="info-grid-2">
                <div><strong>Refrigerator Id:</strong> <span id="refrigerator_id"></span></div>
                <div><strong>Reporting Period:</strong> <span id="reporting_id"></span></div>
            </div>
        </div>

        <div class="section">
            <h4>Functional Status</h4>
            <div class="info-grid-2">
                <div><strong>Functional Status:</strong> <span id="refrigerator_state"></span></div>
                <div><strong>Heat Alarms:</strong> <span id="heat_alarms"></span></div>
                <div><strong>Freeze Alarms:</strong> <span id="freeze_alarms"></span></div>
                <div><strong>Heat Alarms (48 hrs):</strong> <span id="heat_alarms_over_48"></span></div>
                <div><strong>Reason of Alarm:</strong> <span id="reason_temperature_excursion"></span></div>
            </div>
        </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

$(function () {
  display();
$('#downloadPDFBtn').on('click', function () {
    const element = document.getElementById('report-content');
    
    // Generate PDF as base64
    html2pdf()
        .from(element)
        .set({
            margin: 10,
            filename: 'temp.pdf', // Temporary name
            html2canvas: { scale: 2 },
            jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
        })
        .outputPdf('datauristring')
        .then(pdfDataUri => {
            // Extract base64 data
            const base64Data = pdfDataUri.split(',')[1];
            const filename = 'Sentinel_Report_' + Date.now() + '.pdf';
            
            // Save using ODK-X file system
            const writeIntent = {
                action: 'org.opendatakit.common.android.actions.WRITE_FILE',
                filename: filename,
                contentType: 'application/pdf',
                data: base64Data
            };
            
            odkCommon.doAction(
                null,
                'org.opendatakit.common.android.actions.WRITE_FILE',
                writeIntent,
                function(result) {
                    try {
                        const parsed = JSON.parse(result);
                        if (parsed.status === 'OK') {
                            alert('✅ PDF saved successfully!\n\nFile: ' + filename + '\nLocation: ODK Files folder');
                            
                            // Optional: Open the file after saving
                            if (parsed.uri) {
                                const openIntent = {
                                    action: 'org.opendatakit.common.android.actions.OPEN_FILE',
                                    uri: parsed.uri,
                                    type: 'application/pdf'
                                };
                                odkCommon.doAction(null, 'org.opendatakit.common.android.actions.OPEN_FILE', openIntent);
                            }
                        } else {
                            alert('❌ Save failed: ' + result);
                        }
                    } catch (e) {
                        alert('❌ Error: ' + e.message + '\nResult: ' + result);
                    }
                }
            );
        })
        .catch(error => {
            alert('❌ PDF generation failed: ' + error.message);
            console.error('PDF Error:', error);
        });
});
});
</script>

    </body>
</html>
