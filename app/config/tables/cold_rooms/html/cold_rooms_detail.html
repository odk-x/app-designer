<!DOCTYPE html>
<!-- TBL_IV_REF Detailed View -->
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="../../../assets/css/detail.css" type="text/css" rel="stylesheet" />
        <script type="text/javascript" src="../../../assets/commonDefinitions.js"></script>
        <script type="text/javascript" src="../../../assets/libs/jquery-3.4.1.js"></script>
        <script type="text/javascript" src="../../../../system/js/odkCommon.js"></script>
        <script type="text/javascript" src="../../../../system/js/odkData.js"></script>
        <script type="text/javascript" src="../../../../system/tables/js/odkTables.js"></script>
        <script type="text/javascript" src="../../../assets/js/util.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    </head>
    <body>
        <script type="text/javascript" src="../js/cold_rooms_detail.js"></script>

        <div class="card-header">
            <div class="title-block">
                <h3><span id="frig-hdr">Cold Room</span></h3>
                <span id="tracking_id" class="tracking-id">Loading..</span>
                
                <div class="card-actions">
                    <button id="editCRBtn" onclick="onEditCR()" title="Edit" class="hideButton">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button id="delCRBtn" onclick="onDeleteCR()" title="Delete" class="hideButton">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
			<div class="header-icons">
                <i class="bi bi-hospital"></i>
                <i class="bi bi-bar-chart-line"></i>
                <i class="bi bi-box"></i>
                <i class="bi bi-hospital"></i>
                <i class="bi bi-snow"></i>
            </div>
        </div>

        <div class="section">
            <h4>Summary</h4>
            <div class="info-grid-2">
                <div><strong>Facility:</strong> <span id="facility_name"></span></div>
                <div><strong>Status:</strong> <span id="functional_status"></span></div>
                <div><strong>Reason Not Working:</strong> <span id="reason_not_working"></span></div>
                <div><strong>Service Priority:</strong> <span id="maintenance_priority"></span></div>
                <div><strong>Year Installed:</strong> <span id="install_year"></span></div>
                <div><strong>Model ID:</strong> <span id="model_id"></span></div>
                <div><strong>Serial Number:</strong> <span id="serial_number"></span></div>
                <div><strong>Cold Room ID:</strong> <span id="cold_room_id"></span></div>
                <div><strong>Date Serviced:</strong> <span id="date_serviced"></span></div>
            </div>
        </div>

        <div class="bottom-drawer-nav">
            <button class="icon-btn" onclick="setActive(this, 'Information')">
                <i class="bi bi-info-circle"></i>
                Information
            </button>
            <button class="icon-btn" onclick="setActive(this, 'Maintenance')">
                <i class="bi bi-tools"></i>
                Maintenance
            </button>
        </div>

        <div class="drawer" id="Maintenance">
            <button class="drawer-close" onclick="closeDrawer()">×</button>
            <div class="drawer-content">
                <div id="editCRStatusBtn" class="drawer-card hideButton" onclick="onEditCRStatus()">
                    <div class="card-icon"><i class="bi bi-pencil"></i></div>
                    <div class="card-title">Edit Cold Room Status</div>
                </div>

                <div class="drawer-card" onclick="onClickAddMntRec()">
                    <div class="card-icon"><i class="bi bi-plus-circle"></i></div>
                    <div class="card-title">Add Maintenance Record</div>
                </div>
                
                <div class="drawer-card" onclick="onClickViewAllMntRecs()">
                    <div class="card-icon"><i class="bi bi-clock-history"></i></div>
                    <div class="card-title">Maintenance Record Log</div>
                </div>
            </div>
        </div>

        <div class="drawer" id="Information">
            <button class="drawer-close" onclick="closeDrawer()">×</button>
            <div class="drawer-content">
                <div class="drawer-card" onclick="onLinkClickFacility()">
                    <div class="card-icon"><i class="bi bi-building"></i></div>
                    <div class="card-title">Facility Information</div>
                </div>
            </div>
        </div>

        <script>
            $(function() { 
                display(); 
            });
            
            function openDrawer(drawerId) {
                // Close others
                const drawers = document.querySelectorAll('.drawer');
                drawers.forEach(d => d.classList.remove('show'));

                // Open selected
                const drawer = document.getElementById(drawerId);
                if (drawer) drawer.classList.add('show');
            }

            function closeDrawer() {
                document.querySelectorAll('.drawer').forEach(d => d.classList.remove('show'));
                // reset all buttons back to default state
                document.querySelectorAll('.icon-btn').forEach(btn => {
                    btn.classList.remove('active');
                    let icon = btn.querySelector('i');

                    if (icon.classList.contains('bi-info-circle-fill')) icon.classList.replace('bi-info-circle-fill', 'bi-info-circle');
                    if (icon.classList.contains('bi-lightning-charge-fill')) icon.classList.replace('bi-lightning-charge-fill', 'bi-lightning-charge');
                    if (icon.classList.contains('bi-clipboard-check-fill')) icon.classList.replace('bi-clipboard-check-fill', 'bi-clipboard-check');
                });
            }

            function setActive(button, drawer) {
                // Reset all buttons
                document.querySelectorAll('.icon-btn').forEach(btn => {
                    btn.classList.remove('active');
                    let icon = btn.querySelector('i');

                    // revert to outline icons
                    if (icon.classList.contains('bi-info-circle-fill')) icon.classList.replace('bi-info-circle-fill', 'bi-info-circle');
                    if (icon.classList.contains('bi-lightning-charge-fill')) icon.classList.replace('bi-lightning-charge-fill', 'bi-lightning-charge');
                    if (icon.classList.contains('bi-tools')) icon.classList.replace('bi-tools', 'bi-tools'); // tools has no fill
                    if (icon.classList.contains('bi-clipboard-check-fill')) icon.classList.replace('bi-clipboard-check-fill', 'bi-clipboard-check');
                });

                // Activate clicked button
                button.classList.add('active');
                let icon = button.querySelector('i');

                // switch to filled version
                if (icon.classList.contains('bi-info-circle')) icon.classList.replace('bi-info-circle', 'bi-info-circle-fill');
                if (icon.classList.contains('bi-lightning-charge')) icon.classList.replace('bi-lightning-charge', 'bi-lightning-charge-fill');
                if (icon.classList.contains('bi-clipboard-check')) icon.classList.replace('bi-clipboard-check', 'bi-clipboard-check-fill');
                // tools has no fill, so keep as-is

                // open drawer
                openDrawer(drawer);
            }

            function openTab(evt, tabName) {
                var i, tabcontent, tablinks;
                tabcontent = document.getElementsByClassName("tabcontent");
                for (i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "none";
                }
                tablinks = document.getElementsByClassName("tablink");
                for (i = 0; i < tablinks.length; i++) {
                    tablinks[i].classList.remove("active");
                }
                document.getElementById(tabName).style.display = "block";
                evt.currentTarget.classList.add("active");
            }

            // Show first tab by default
            document.addEventListener("DOMContentLoaded", function() {
                document.querySelector(".tablink").click();
            });

            $(function() { display(); });
        </script>
    </body>
</html>
