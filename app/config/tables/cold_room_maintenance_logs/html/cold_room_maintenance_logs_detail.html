<!DOCTYPE html>
<!-- TBL_IV_REF Detailed View -->
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="../../../assets/css/detail.css" type="text/css" rel="stylesheet" />
        <script type="text/javascript" src="../../../assets/commonDefinitions.js"></script>
        <script type="text/javascript" src="../../../assets/libs/jquery-3.4.1.js"></script>
        <script type="text/javascript" src="../../../../system/js/odkCommon.js"></script>
        <script type="text/javascript" src="../../../../system/js/odkData.js"></script>
        <script type="text/javascript" src="../../../../system/tables/js/odkTables.js"></script>
        <script type="text/javascript" src="../../../assets/js/util.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    </head>
    <body>
        <script type="text/javascript" src="../js/cold_room_maintenance_logs_detail.js"></script>

        <div class="card-header">
            <div class="title-block">
                <h3><span id="frig-hdr">Cold Room</span></h3>
                <span id="tracking_id" class="tracking-id">Loading..</span>
                
                <div class="card-actions">
                    <button onclick="onMovFrig()" title="Move" class="hideButton">
                        <i class="bi bi-arrow-left-right"></i> Move
                    </button>
                    <button onclick="onEditLog()" title="Edit" class="hideButton">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button onclick="onDeleteLog()" title="Delete" class="hideButton">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
            
            <div class="header-icons">
                <i class="bi bi-hospital"></i>
                <i class="bi bi-bar-chart-line"></i>
                <i class="bi bi-box"></i>
                <i class="bi bi-hospital"></i>
                <i class="bi bi-snow"></i>
            </div>
        </div>

        <div class="section">
            <h4>Maintenance Log Information</h4>
            <div class="info-grid-2">
                <div><strong>Cold Room Id:</strong> <span id="cold_room_id"></span></div>
                <div><strong>Functional Status:</strong> <span id="functional_status"></span></div>
                <div><strong>Reason Not Working:</strong> <span id="reason_not_working"></span></div>
                <div><strong>Date Serviced:</strong> <span id="date_serviced"></span></div>
                <div><strong>Type of Maintenance:</strong> <span id="maint_type"></span></div>
                <div><strong>Spare Parts:</strong> <span id="spare_parts"></span></div>
                <div><strong>Additional Spare Parts:</strong> <span id="addtl_spare_parts"></span></div>
                <div><strong>Actions Taken:</strong> <span id="actions_taken"></span></div>
            </div>
        </div>


        <script>
            $(function() { display(); });
        </script>
    </body>
</html>
