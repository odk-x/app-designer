<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="ratchet/css/ratchet.css" type="text/css" rel="stylesheet" />
        <link href="ratchet/css/ratchet-theme-android.css" type="text/css" rel="stylesheet" />
        <link href="css/homeScreen.css" type="text/css" rel="stylesheet" />
        <script type="text/javascript" src="commonDefinitions.js"></script>
        <script type="text/javascript" src="libs/jquery-3.4.1.js"></script>
        <script type="text/javascript" src="../../system/js/odkCommon.js"></script>
        <script type="text/javascript" src="../../system/js/odkData.js"></script>
        <script type="text/javascript" src="../../system/tables/js/odkTables.js"></script>
        <script type="text/javascript" src="js/linkedAdminRegion.js"></script>
        <script type="text/javascript" src="js/util.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body id="main">
        <header>
            <div class="header">
                <h1 id="header1">Loading...</h1>
                <div class="location" id="breadcrumb1">Location breadcrumb or details</div>
                <div class="header-icons">
                    <i class="bi bi-speedometer2"></i>
                    <i class="bi bi-bar-chart-line"></i>
                    <i class="bi bi-grid-3x3-gap"></i>
                    <i class="bi bi-hospital"></i>
                    <i class="bi bi-snow"></i>
                </div>
            </div>
        </header>
        
        <br>
        
        <div class="section">
            <h2>Health Facilities</h2>
            <div class="grid">
                <div id="view-facilities-map-new" class="card gray">
                    <div class="card-icon">
                        <img src="img/locate.png" alt="logo">
                    </div>
                    <div class="card-title">View Facilities Map</div>
                </div>

                <div id="view-facilities-list-new" class="card gray">
                    <div class="card-icon">
                        <img src="img/list.png" alt="logo">
                    </div>
                    <div class="card-title">View Facilities List</div>
                </div>

                <div id="filter-facilities-new" class="card gray">
                    <div class="card-icon">
                        <img src="img/filter.png" alt="logo">
                    </div>
                    <div class="card-title">Filter by Type</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>Cold Chain Equipment</h2>
            <div class="grid">
                <div id="view-all-refrigerators-new" class="card gray">
                    <div class="card-icon">
                        <img src="img/refrigerator.png" alt="logo">
                    </div>
                    <div class="card-title">Refrigerators</div>
                </div>

                <div id="view-all-cold-rooms-new" class="card gray">
                    <div class="card-icon">
                        <img src="img/coldroom.png" alt="logo">
                    </div>
                    <div class="card-title">Cold Rooms</div>
                </div>

                <div id="view-service-refrigerators-new" class="card gray">
                    <div class="card-icon">
                        <img src="img/setting.png" alt="logo">
                    </div>
                    <div class="card-title">Services Required</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Models</h2>
            <div class="grid">
                <div id="view-models-new" class="card gray">
                    <div class="card-icon">
                        <img src="img/model.png" alt="logo">
                    </div>
                    <div class="card-title">Refrigerator Models</div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            $(display);
        </script>
    </body>
</html>

<style>
/* CSS Stylesheet - Homescreen*/
html, body {
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    text-align: center;
    background: #f9f9f9;
    color: #333;
    background-repeat: repeat;
    background-size: cover;
    background-position: center;
    position: relative;
}

#wrapper {
    margin: 10px 0 0 0;
    padding: 0;
}

div {
    position: relative;
}

/* Header Styles */
.header {
    background: linear-gradient(135deg, #2a9d8f, #264653);
    padding: 20px;
    color: #fff;
    position: relative;
}

.header h1 {
    margin: 0;
    font-size: 20px;
    color: #FFFFFF;
}

.header .location {
    font-size: 14px;
    opacity: 0.9;
}

.header .settings {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 22px;
    cursor: pointer;
}

.header-icons i {
    position: absolute;
    font-size: 28px;
    color: rgba(255, 255, 255, 0.15);
    animation: float 12s infinite linear;
}

.header-icons i:nth-child(1) { top: 10px; left: 30px; }
.header-icons i:nth-child(2) { top: 50px; right: 60px; }
.header-icons i:nth-child(3) { bottom: 20px; left: 80px; }
.header-icons i:nth-child(4) { bottom: 40px; right: 30px; }
.header-icons i:nth-child(5) { top: 20px; right: 120px; }

@keyframes float {
    0%   { transform: translateY(0) rotate(0); }
    50%  { transform: translateY(-8px) rotate(10deg); }
    100% { transform: translateY(0) rotate(0); }
}

/* Section Styles */
.section {
    margin: 08px;
}

.section h2 {
    font-size: 16px;
    text-align: left;
    margin-bottom: 12px;
    color: #444;
}

/* Grid Layout */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(111.12px, 1fr));
    gap: 10px;
    justify-content: start;
}

/* Card Styles */
.card {
    width: 118.12px;
    height: 124.12px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s;
    overflow: hidden;
    position: relative;
}

.card:hover {
    transform: translateY(-4px);
}

.card-icon {
    width: 40px;
    height: 40px;
    background: transparent; /* no background */
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #2a9d8f;
    box-shadow: none; /* remove shadow since no background */
    margin-bottom: 10px;
}

.card-icon img {
    height: 22px;
    width: 22px;
    display: block;
    object-fit: contain;
}

.card-title {
    font-weight: bold;
    font-size: 14px;
    text-align: left;
    margin-bottom: 5px;
}

.card-subtitle {
    font-size: 12px;
    color: #777;
    margin-bottom: 10px;
}

.card-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 24px;
    border: 1px solid #2a9d8f;
    border-radius: 6px;
    background: rgba(42, 157, 143, 0.05);
    font-size: 14px;
    font-weight: bold;
    color: #2a9d8f;
    text-decoration: none;
    margin-top: auto;
    align-self: flex-start;
}

/* Color Themes */
.blue { background: white; }
.green { background: #e8f5e9; }
.gray { background: #eceff1; }

/* Button Styles */
.btn-launch {
    width: 80%;
    max-width: 500px;
    height: 80px;
    font-size: 16pt;
    color: white;
    margin: 0 auto 35px;
    background-color: teal;
}

/* Utility Styles */
.app-title {
    color: black;
}

.hdr-divider {
    border-bottom: 2px solid darkturquoise;
    margin-bottom: 10px;
}

.descStyle {
    padding-bottom: 10px;
    font-size: 16px;
    color: #FFFFFF;
}
</style>
