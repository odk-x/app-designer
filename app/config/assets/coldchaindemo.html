<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="ratchet/css/ratchet.css" type="text/css" rel="stylesheet" />
        <link href="ratchet/css/ratchet-theme-android.css" type="text/css" rel="stylesheet" />
        <link href="css/homeScreen.css" type="text/css" rel="stylesheet" />
        <script type="text/javascript" src="commonDefinitions.js"></script>
        <script type="text/javascript" src="libs/jquery-3.4.1.js"></script>
        <script type="text/javascript" src="../../system/js/odkCommon.js"></script>
        <script type="text/javascript" src="../../system/tables/js/odkTables.js"></script>
        <script type="text/javascript" src="js/coldchaindemo.js"></script>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    </head>

<body id="main">
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <div class="logo"><i class="bi bi-thermometer-snow"></i></div>
                <h1 id="header">Administrator Options</h1>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page">
            <div class="top-grid">
                <div class="panel fade-in" aria-labelledby="regions-heading">
                    
                    <!-- Dynamic region cards appended here -->
                    <div id="buttonsDiv" aria-live="polite">
					
					    <div class="region-card fade-in" >
							<div class="card-footer">
										<button id="view-facilities" class="btn-primary"><i class="fa fa-level-down-alt"></i> View Health Facilities</button>
							</div>
						</div>

					    <div class="region-card fade-in" >
							<div class="card-footer">
										<button id="view-refrigerators" class="btn-primary"><i class="fa fa-level-down-alt"></i> View Inventory</button>
							</div>
						</div>

						<div class="region-card fade-in" >
							<div class="card-footer">
										<button id="view-models"  class="btn-primary"><i class="fa fa-level-down-alt"></i> View Refrigerator Models</button>
							</div>
						</div>
						
						<div class="region-card fade-in" >
							<div class="card-footer">
										<button id="add-facility"  class="btn-primary"><i class="fa fa-level-down-alt"></i> Add Health Facility</button>
							</div>
						</div>

                    </div>

                    <!-- Description / login placeholder -->
                    <div id="description"></div>
                </div>
            </div>

            <!-- Spacing for footer -->
            <div style="height:80px"></div>
        </div>
    </main>

</body>

        <script type="text/javascript">
            $(display);
        </script>
</html>
